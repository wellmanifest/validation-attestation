[project]
name = "wellmanifest-validation-attestation"
version = "0.1.0.dev0"
description = "Wellmanifest exact-subject validation attestation standard"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.20.163"
revision = "6738f734d7f19e178996c671c26e4165e8b21d4a"
gate = "./project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
