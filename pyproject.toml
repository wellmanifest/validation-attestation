[project]
name = "wellmanifest-validation-attestation"
version = "0.1.0.dev0"
description = "Wellmanifest exact-subject validation attestation standard"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.18.6"
revision = "01397097ac53a01b2dd544f0b5908d22d1b526d5"
gate = "./project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
